name: fyp_live_coach
description: AI Presentation Analyzer & Live Coach cross-platform application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  socket_io_client: ^2.0.3+1
  camera: ^0.10.5+5
  record: ^5.0.4
  fl_chart: ^0.66.0
  file_picker: ^6.1.1
  provider: ^6.1.1
  pdf: ^3.10.7
  printing: ^5.11.0
  intl: ^0.19.0
  url_launcher: ^6.2.4
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
